name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Run smoke checks
        run: python scripts/smoke_check.py --skip-pytest

      - name: Run deployed canary
        if: ${{ env.STREAMLIT_APP_URL != '' }}
        run: python scripts/smoke_check.py --skip-pytest --skip-streamlit --url "$STREAMLIT_APP_URL"
